[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbo-experiments"
version = "0.1.0"
description = "QBO targets, boundary operators and CESM/WACCM experiment diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "netCDF4>=1.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qbo-build-targets = "qbo.targets:main"
qbo-build-backgrounds = "qbo.backgrounds:main"
qbo-validate-targets = "qbo.validate:main"
qbo-native-boundary = "qbo.native:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
